name: SGLE Validation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate documentation
        run: |
          set -euo pipefail
          for file in README.md README.en.md README.es.md CHANGELOG.md ROADMAP.md DOCUMENTACAO.md; do
            test -s "$file"
          done
          grep -q "Filipe G Morais" README.md
          grep -q "Filipe G Morais" README.en.md
          grep -q "Filipe G Morais" README.es.md

      - name: Validate project structure
        run: |
          set -euo pipefail
          test -d documentacao
          test -f documentacao/arquitetura.md
          test -f documentacao/fluxo.md
          test -f documentacao/formulario.md
          test -f documentacao/indicadores.md
          test -f documentacao/planilha.md
          test -f documentacao/regras-negocio.md
          test -f documentacao/seguranca.md

      - name: Validate Apps Script and web syntax when files exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          gs_files=(backend/*.gs)
          js_files=(frontend/*.js)
          for file in "${gs_files[@]}"; do
            cp "$file" /tmp/sgle-check.js
            node --check /tmp/sgle-check.js
          done
          for file in "${js_files[@]}"; do
            node --check "$file"
          done

      - name: Privacy guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' . --exclude-dir=.git; then
            echo "Potential secret detected."
            exit 1
          fi
